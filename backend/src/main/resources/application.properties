spring.application.name=backend

# Database configuration

# MySQL database connection settings
spring.datasource.url=jdbc:mysql://localhost:3307/maia_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.address=0.0.0.0
server.port=8080

# Geoapify API key
geoapify.api.key=${GEOAPIFY_API_KEY}

# Groq API configuration
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b

server.error.include-message=always
server.error.include-binding-errors=always

# WorldTides API key
worldtides.api.key=${WORLDTIDES_API_KEY}

# OpenWeather API key infelizmente vamos usar duas pq a meteo fica muito fora do ae :(
openweather.api.key=${OPENWEATHER_API_KEY}
